[package]
name = "image-flatify"
version = "6.0.0"
edition = "2021"
authors = ["Juga Paazmaya <paazmaya@yahoo.com>"]
description = "Take a directory, search images recursively and rename as single flat directory with date based filenames"
license = "MIT"
repository = "https://github.com/paazmaya/image-flatify"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
walkdir = "2.5.0"
regex = "1.13.1"
chrono = "0.4.45"
md-5 = "0.11.0"
rand = "0.10.2"
which = "8.0.6"

[dev-dependencies]
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"
